# File: native-app.yml
# Purpose: Validate the complete actual Windows Rust/PostgreSQL native application without system services.
name: Native application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      retain_package:
        description: Retain full unsigned package for explicit trusted-main owner review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Actual PostgreSQL Windows workbench
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up current Node build tool
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up patched build-only Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          check-latest: true
      - name: Install locked desktop/dashboard tools without implicit scripts
        run: |
          rustup show
          npm --prefix web ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix desktop ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:ELECTRON_CACHE=Join-Path $PWD '.runtime/electron-download'
          node desktop/node_modules/electron/install.js
      - name: Audit the actual native dependency graph
        run: npm --prefix desktop audit --audit-level=high
      - name: Verify real filesystem, routing, loopback and ZIP boundaries
        run: |
          npm --prefix desktop test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p 'test_native_*.py' -v
      - name: Prepare only verified official app-local PostgreSQL and signed licensed runtime inputs
        shell: pwsh
        run: |
          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs=(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'Licensed Visual Studio source is required.' }
          $version=Get-ChildItem -LiteralPath (Join-Path $vs 'VC/Redist/MSVC') -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [Version]$_.Name } -Descending | Select-Object -First 1
          $crt=Get-ChildItem -LiteralPath (Join-Path $version.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' | Select-Object -First 1
          if (-not $crt) { throw 'Signed x64 runtime source unavailable.' }
          python scripts/postgres-sdk.py --output .runtime/postgres-sdk --crt-sdk $crt.FullName
      - name: Build the full genuine Windows application
        shell: pwsh
        run: |
          $env:CJO_POSTGRES_SDK=Join-Path $PWD '.runtime/postgres-sdk'
          $env:CJO_NATIVE_OUTPUT='release/windows'
          node scripts/build-native.mjs
      - name: Relocate complete ZIP and use actual native controls twice
        run: python scripts/archive_native.py release/windows/win-unpacked artifacts/native/windows
      - name: Retain only bounded receipts and own-window screenshots by default
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-orchestrator-acceptance
          path: |
            artifacts/native/windows/acceptance.json
            artifacts/native/windows/archive.json
            artifacts/native/windows/failure.json
            artifacts/native/windows/*.png
          retention-days: 1
          if-no-files-found: warn
      - name: Retain complete unsigned package only by explicit trusted-main opt-in
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retain_package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CloudJobOrchestrator-1.1.0-windows-x64
          path: |
            release/windows/CloudJobOrchestrator-1.1.0-windows-x64.zip
            release/windows/CloudJobOrchestrator-1.1.0-windows-x64.zip.sha256
          retention-days: 1
          if-no-files-found: error
