[package]
name = "cloud-job-orchestrator"
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
authors = ["Jason Stys"]
description = "A safe, observable DAG job control plane with transactional PostgreSQL leases"
license = "MIT"
repository = "https://github.com/JasonStys/cloud-job-orchestrator"
readme = "README.md"
keywords = ["scheduler", "dag", "postgresql", "leases", "cloud"]
categories = ["web-programming", "command-line-utilities"]

[lib]
name = "cloud_job_orchestrator"
path = "src/lib.rs"

[[bin]]
name = "orchestratord"
path = "src/bin/orchestratord.rs"

[[bin]]
name = "orchestrator-worker"
path = "src/bin/orchestrator_worker.rs"

[[bin]]
name = "orchestratorctl"
path = "src/bin/orchestratorctl.rs"

[dependencies]
axum = { version = "0.8.9", features = ["json", "tokio", "http1"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["serde", "formatting"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "request-id", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
uuid = { version = "1.22.0", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1.3"
proptest = "1.10.0"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
missing_errors_doc = "allow"
too_long_first_doc_paragraph = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
